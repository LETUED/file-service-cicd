# 서버. 파일은 S3, 목록은 RDS MySQL. 자격 증명은 EC2 역할 · Secrets Manager 에서 옴.
app:
  s3:
    bucket: ${APP_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
  registry:
    kind: mysql

spring:
  datasource:
    # 세 값 모두 환경 변수. user-data 가 Secrets Manager 에서 읽어 .env 에 씀
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 최초 기동 때 file_record 표를 만듦. 운영에서는 validate 로 바꾸고 마이그레이션 도구를 씀
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

logging:
  level:
    com.example.file: info

management:
  endpoint:
    health:
      show-details: never
