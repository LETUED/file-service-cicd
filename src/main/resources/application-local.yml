# 내 PC. 파일은 디스크, 목록은 H2 메모리 DB. S3 · AWS 자격 증명 · MySQL 설치가 전혀 필요 없음.
file:
  local:
    # Windows : C:/CE/98.data/uploads   macOS : /Users/<me>/CE/98.data/uploads
    path: ./data/uploads

spring:
  datasource:
    # 메모리 DB. 앱을 끄면 목록이 사라짐 (파일은 디스크에 남음)
    url: jdbc:h2:mem:files;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  registry:
    kind: h2

logging:
  level:
    com.example.file: debug

management:
  endpoint:
    health:
      show-details: always
